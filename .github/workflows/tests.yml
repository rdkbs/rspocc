name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Application
        run: composer setup

      - name: Setup Playwright
        run: |
          bunx --package playwright@1.63.0 playwright install --with-deps chromium
          mkdir -p node_modules/.bin
          printf '%s\n' '#!/usr/bin/env sh' 'exec bunx --no-install --package playwright@1.63.0 playwright "$@"' > node_modules/.bin/playwright
          chmod +x node_modules/.bin/playwright

      - name: Run CI Checks
        run: composer ci:check
